<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>
    <h1>Dashboard</h1>
    <h2>MQTT-Broker</h2>
    <p>Distance Sensor: <span id="distanceSensorValue"></span>cm</p>
    <p>Touch: <span id="touchSensorValue"></span></p>
    <script src="mqtt.min.js"></script>
    <script>
        console.log(mqtt);

        const distanceSensorValue = document.querySelector('#distanceSensorValue');

        const touchSensorValue = document.querySelector('#touchSensorValue')

        const broker = `ws://${window.location.host}:9001`
        const mqttClient = mqtt.connect(broker, {});
        mqttClient.on('connect', () => {
            console.log('connected');
            mqttClient.subscribe('Eragonis/#', err => {
                if (err) console.error(err);
            });
        })

        mqttClient.on('message', (topic, message) => {
            console.log(`got message from topic ${topic}: ${message}`);
            switch (topic) {
                case 'Eragonis/sensors/distance':
                    distanceSensorValue.textContent = parseFloat(message);
                    break;

                case 'Eragonis/sensors/touch':
                    touchSensorValue.textContent = String(message);
                    break;

                default:
                    break;
            }
        })

    </script>
</body>

</html>
